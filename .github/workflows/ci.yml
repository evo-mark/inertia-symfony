name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ["8.4", "8.5"]
                dependencies: [highest, lowest]

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: curl, json
                  coverage: none
                  tools: composer:v2

            # Cache Composer's download cache, not vendor/.
            - name: Get the Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php }}-${{ matrix.dependencies }}-

            # composer.lock isn't committed, so the highest run resolves the newest
            # versions; the lowest run proves the minimums in composer.json.
            - name: Install the highest dependencies
              if: matrix.dependencies == 'highest'
              run: composer update --no-interaction --no-progress --prefer-stable

            - name: Install the lowest dependencies
              if: matrix.dependencies == 'lowest'
              run: composer update --no-interaction --no-progress --prefer-stable --prefer-lowest

            # Deprecations from the bundle's dependencies fail the highest run; the lowest
            # run allows them, since old dependency versions trigger their own.
            - name: Run the tests
              if: matrix.dependencies == 'highest'
              run: vendor/bin/phpunit --fail-on-deprecation --display-deprecations

            - name: Run the tests
              if: matrix.dependencies == 'lowest'
              run: vendor/bin/phpunit

    coding-standards:
        name: Coding standards
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer:v2

            - run: composer update --no-interaction --no-progress --prefer-stable

            - run: vendor/bin/php-cs-fixer check --diff
