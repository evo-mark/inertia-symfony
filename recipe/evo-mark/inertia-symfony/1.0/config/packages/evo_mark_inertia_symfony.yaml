# Inertia.js adapter for Symfony
# All options: bin/console config:dump-reference evo_mark_inertia_symfony
evo_mark_inertia_symfony:
    # The Twig template every page is rendered into on a full page load
    root_view: app.html.twig

    ssr:
        enabled: '%env(bool:INERTIA_SSR_ENABLED)%'
        url: '%env(INERTIA_SSR_URL)%'

when@test:
    evo_mark_inertia_symfony:
        # Tests render pages client-side, without an SSR server
        ssr:
            enabled: false
